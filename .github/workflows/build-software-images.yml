name: Build GP-TARS service images

on:
  push:
    branches: [main]
    paths:
      - 'software/**'
      - '.github/workflows/build-software-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-runtime-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - tars-core
          - tars-api
          - tars-display
          - tars-stt
          - tars-tts
          - tars-vision
          - tars-motion
          - tars-can
          - tars-telemetry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: software/services/runtime/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:main
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  build-ros:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tars-ros
        uses: docker/build-push-action@v6
        with:
          context: .
          file: software/services/ros/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tars-ros:main
            ghcr.io/${{ github.repository }}/tars-ros:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1300" width="1460" height="1300" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <title>GP-TARS V2 front elevation, 1,000 mm standing envelope</title>
  <desc>Scale front elevation showing the four-slab TARS form, articulation axes, equipment reservations and the Upper Lid display. All dimensions in millimetres at the 3.993659 reference scale.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7d8b95"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 z" fill="#7d8b95"/>
    </marker>
  </defs>

  <g stroke-linecap="square">
    <!-- overall reference envelope: 958.718 x 1000 -->
    <rect x="220" y="120" width="958.7" height="1000" fill="none" stroke="#9aa7b0" stroke-width="1.5" stroke-dasharray="9 7"/>

    <!-- port leg/arm slab -->
    <rect x="220" y="120" width="213.3" height="1000" fill="#8b98a2" fill-opacity="0.10" stroke="#5c6b75" stroke-width="3"/>
    <!-- central chassis: 532.083 wide, drawn as the two inner slabs -->
    <rect x="433.3" y="120" width="532.1" height="1000" fill="#8b98a2" fill-opacity="0.06" stroke="#5c6b75" stroke-width="3.5"/>
    <line x1="699.35" y1="120" x2="699.35" y2="1120" stroke="#5c6b75" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>
    <!-- starboard leg/arm slab -->
    <rect x="965.4" y="120" width="213.3" height="1000" fill="#8b98a2" fill-opacity="0.10" stroke="#5c6b75" stroke-width="3"/>

    <!-- ground line -->
    <line x1="150" y1="1120" x2="1250" y2="1120" stroke="#5c6b75" stroke-width="2.5"/>
    <g stroke="#5c6b75" stroke-width="1.2" opacity="0.7">
      <line x1="170" y1="1120" x2="150" y2="1140"/><line x1="210" y1="1120" x2="190" y2="1140"/>
      <line x1="250" y1="1120" x2="230" y2="1140"/><line x1="290" y1="1120" x2="270" y2="1140"/>
      <line x1="330" y1="1120" x2="310" y2="1140"/><line x1="370" y1="1120" x2="350" y2="1140"/>
      <line x1="410" y1="1120" x2="390" y2="1140"/><line x1="450" y1="1120" x2="430" y2="1140"/>
      <line x1="490" y1="1120" x2="470" y2="1140"/><line x1="530" y1="1120" x2="510" y2="1140"/>
      <line x1="570" y1="1120" x2="550" y2="1140"/><line x1="610" y1="1120" x2="590" y2="1140"/>
      <line x1="650" y1="1120" x2="630" y2="1140"/><line x1="690" y1="1120" x2="670" y2="1140"/>
      <line x1="730" y1="1120" x2="710" y2="1140"/><line x1="770" y1="1120" x2="750" y2="1140"/>
      <line x1="810" y1="1120" x2="790" y2="1140"/><line x1="850" y1="1120" x2="830" y2="1140"/>
      <line x1="890" y1="1120" x2="870" y2="1140"/><line x1="930" y1="1120" x2="910" y2="1140"/>
      <line x1="970" y1="1120" x2="950" y2="1140"/><line x1="1010" y1="1120" x2="990" y2="1140"/>
      <line x1="1050" y1="1120" x2="1030" y2="1140"/><line x1="1090" y1="1120" x2="1070" y2="1140"/>
      <line x1="1130" y1="1120" x2="1110" y2="1140"/><line x1="1170" y1="1120" x2="1150" y2="1140"/>
      <line x1="1210" y1="1120" x2="1190" y2="1140"/><line x1="1250" y1="1120" x2="1230" y2="1140"/>
    </g>

    <!-- ================= UPPER LID: 889.9 to 1000 = 110.1 mm ================= -->
    <rect x="433.3" y="120" width="532.1" height="110.1" fill="#d97b19" fill-opacity="0.07" stroke="#5c6b75" stroke-width="2"/>
    <!-- bar display, 400 x 70 active area within the 500 x 85 usable aperture -->
    <rect x="499.35" y="140" width="400" height="70" rx="4" fill="#d97b19" fill-opacity="0.30" stroke="#a95309" stroke-width="2.5"/>
    <text x="699.35" y="182" font-size="26" font-weight="700" fill="#a95309" text-anchor="middle">BAR DISPLAY</text>
    <text x="975" y="163" font-size="20" fill="#a95309" font-weight="700">UPPER LID</text>
    <text x="975" y="188" font-size="17" fill="#7d8b95">110.1 mm rigid section</text>
    <text x="975" y="210" font-size="17" fill="#7d8b95">only bar panels fit</text>

    <!-- ================= ARTICULATION AXES ================= -->
    <g stroke="#b54331" stroke-width="2" stroke-dasharray="14 6 3 6">
      <line x1="300" y1="230.1" x2="1240" y2="230.1"/>
      <line x1="300" y1="282.0" x2="1240" y2="282.0"/>
      <line x1="300" y1="333.9" x2="1240" y2="333.9"/>
      <line x1="300" y1="509.2" x2="1240" y2="509.2"/>
    </g>
    <g fill="#b54331" font-size="17" font-weight="700">
      <circle cx="699.35" cy="230.1" r="7" fill="none" stroke="#b54331" stroke-width="2.5"/>
      <circle cx="699.35" cy="282.0" r="7" fill="none" stroke="#b54331" stroke-width="2.5"/>
      <circle cx="699.35" cy="333.9" r="7" fill="none" stroke="#b54331" stroke-width="2.5"/>
      <circle cx="699.35" cy="509.2" r="9" fill="none" stroke="#b54331" stroke-width="3"/>
      <text x="1250" y="235">UPPER SECONDARY · Y 889.9</text>
      <text x="1250" y="287">UPPER MAIN · Y 838.0</text>
      <text x="1250" y="339">LOWER SECONDARY · Y 786.1</text>
      <text x="1250" y="514">LOWER MAIN · Y 610.8</text>
    </g>

    <!-- ================= EQUIPMENT RESERVATIONS ================= -->
    <!-- GPU 420-550, 300 wide -->
    <rect x="549.35" y="570" width="300" height="130" fill="#d97b19" fill-opacity="0.20" stroke="#a95309" stroke-width="2"/>
    <text x="699.35" y="628" font-size="22" font-weight="700" fill="#a95309" text-anchor="middle">GPU</text>
    <text x="699.35" y="654" font-size="17" fill="#a95309" text-anchor="middle">300 × 130 × 60</text>

    <!-- mini PC service envelope 165-390, 225 wide -->
    <rect x="586.85" y="730" width="225" height="225" fill="#276787" fill-opacity="0.14" stroke="#276787" stroke-width="1.6" stroke-dasharray="7 5"/>
    <!-- mini PC body 195 x 195 -->
    <rect x="601.85" y="745" width="195" height="195" fill="#276787" fill-opacity="0.28" stroke="#276787" stroke-width="2.5"/>
    <text x="699.35" y="832" font-size="22" font-weight="700" fill="#276787" text-anchor="middle">AI X1 PRO</text>
    <text x="699.35" y="858" font-size="17" fill="#276787" text-anchor="middle">195 × 195 × 47.5</text>
    <text x="699.35" y="884" font-size="15" fill="#7d8b95" text-anchor="middle">225 keep-out</text>

    <!-- battery 0-150, 300 wide -->
    <rect x="549.35" y="970" width="300" height="150" fill="#27845a" fill-opacity="0.22" stroke="#27845a" stroke-width="2.5"/>
    <text x="699.35" y="1038" font-size="22" font-weight="700" fill="#27845a" text-anchor="middle">24 V BATTERY</text>
    <text x="699.35" y="1064" font-size="17" fill="#27845a" text-anchor="middle">300 × 150 × 120</text>

    <!-- ================= DIMENSIONS ================= -->
    <!-- overall height -->
    <line x1="150" y1="120" x2="150" y2="1120" stroke="#7d8b95" stroke-width="1.6" marker-start="url(#b)" marker-end="url(#a)"/>
    <text x="132" y="620" font-size="28" font-weight="700" fill="#5c6b75" text-anchor="middle" transform="rotate(-90 132 620)">1,000 mm</text>

    <!-- overall width -->
    <line x1="220" y1="1200" x2="1178.7" y2="1200" stroke="#7d8b95" stroke-width="1.6" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="220" y1="1130" x2="220" y2="1210" stroke="#7d8b95" stroke-width="1"/>
    <line x1="1178.7" y1="1130" x2="1178.7" y2="1210" stroke="#7d8b95" stroke-width="1"/>
    <text x="699.35" y="1231" font-size="26" font-weight="700" fill="#5c6b75" text-anchor="middle">958.7 mm reference width</text>

    <!-- chassis width -->
    <line x1="433.3" y1="1165" x2="965.4" y2="1165" stroke="#7d8b95" stroke-width="1.6" marker-start="url(#b)" marker-end="url(#a)"/>
    <line x1="433.3" y1="1125" x2="433.3" y2="1175" stroke="#7d8b95" stroke-width="1"/>
    <line x1="965.4" y1="1125" x2="965.4" y2="1175" stroke="#7d8b95" stroke-width="1"/>
    <text x="699.35" y="1158" font-size="20" font-weight="700" fill="#5c6b75" text-anchor="middle">532.1 central chassis</text>

    <!-- slab callouts -->
    <text x="326" y="700" font-size="19" font-weight="700" fill="#5c6b75" text-anchor="middle" transform="rotate(-90 326 700)">PORT LEG / ARM</text>
    <text x="1072" y="700" font-size="19" font-weight="700" fill="#5c6b75" text-anchor="middle" transform="rotate(-90 1072 700)">STARBOARD LEG / ARM</text>

    <!-- header -->
    <text x="150" y="52" font-size="30" font-weight="800" fill="#5c6b75">GP-TARS V2 1000 — FRONT ELEVATION</text>
    <text x="150" y="82" font-size="19" fill="#7d8b95">Scale reference 3.993659 · dimensions in millimetres · equipment envelopes are reservations, not parts</text>

    <!-- note -->
    <text x="150" y="1285" font-size="17" fill="#7d8b95">Bodywork is formed 5052-H32 aluminium, 1.2 mm nominal. Panels are cosmetic and carry no walking load.</text>
  </g>
</svg>

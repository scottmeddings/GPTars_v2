<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1330" width="1240" height="1330" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <title>GP-TARS V2 R07 general arrangement, front and side elevations</title>
  <desc>Dimensioned front and side elevations at the 480 x 1000 x 259.9 mm build size, showing the central chassis, leg-arm slabs, hip axis, display aperture, rockered feet and the internal equipment stack. Dimensions in millimetres.</desc>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#9cabb4"/>
    </marker>
    <marker id="al" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <path d="M9,0 L0,3 L9,6 z" fill="#9cabb4"/>
    </marker>
  </defs>

  <g font-size="15" fill="#9cabb4">
    <text x="60" y="42" font-size="26" font-weight="800" fill="#9aa7b0">GP-TARS V2 1000 · R08 · GENERAL ARRANGEMENT</text>
    <text x="60" y="66" font-size="15">Front and side elevations · dimensions in millimetres · generated from cad/parameters.py</text>
  </g>
  <line x1="60" y1="82" x2="1180" y2="82" stroke="#9aa7b0" stroke-width="1.5"/>

  <text x="390" y="118" font-size="17" font-weight="700" fill="#9aa7b0" text-anchor="middle">FRONT ELEVATION</text>
  <text x="910" y="118" font-size="17" font-weight="700" fill="#9aa7b0" text-anchor="middle">SIDE ELEVATION</text>

  <!-- ============================ FRONT ============================ -->
  <g>
    <!-- leg-arm slabs -->
    <rect x="150" y="150" width="116" height="1000" fill="#6c7a85" fill-opacity="0.16" stroke="#9aa7b0" stroke-width="2.5"/>
    <rect x="514" y="150" width="116" height="1000" fill="#6c7a85" fill-opacity="0.16" stroke="#9aa7b0" stroke-width="2.5"/>
    <!-- central chassis -->
    <rect x="270" y="150" width="240" height="1000" fill="#8b98a2" fill-opacity="0.08" stroke="#9aa7b0" stroke-width="3"/>

    <!-- frame rails, hidden detail -->
    <g stroke="#d97b19" stroke-width="1.4" stroke-dasharray="7 5" fill="none">
      <rect x="271.2" y="180" width="20" height="920"/>
      <rect x="488.8" y="180" width="20" height="920"/>
    </g>

    <!-- equipment stack -->
    <rect x="295" y="945" width="190" height="150" fill="#58bd8c" fill-opacity="0.28" stroke="#58bd8c" stroke-width="1.8"/>
    <text x="390" y="1028" font-size="14" font-weight="700" fill="#58bd8c" text-anchor="middle">BATTERY</text>
    <rect x="297" y="730" width="90" height="200" fill="#8ad0a8" fill-opacity="0.26" stroke="#8ad0a8" stroke-width="1.6"/>
    <text x="342" y="835" font-size="12" font-weight="700" fill="#8ad0a8" text-anchor="middle">GPU</text>
    <rect x="395" y="695" width="85" height="225" fill="#6fb8dd" fill-opacity="0.26" stroke="#6fb8dd" stroke-width="1.6"/>
    <text x="437" y="812" font-size="12" font-weight="700" fill="#6fb8dd" text-anchor="middle">PC</text>
    <rect x="326" y="600" width="128" height="90" fill="#e88a7a" fill-opacity="0.24" stroke="#e88a7a" stroke-width="1.6"/>
    <text x="390" y="650" font-size="12" font-weight="700" fill="#e88a7a" text-anchor="middle">BOOST ×2</text>

    <!-- hip bulkheads -->
    <rect x="271.2" y="498" width="20" height="82" fill="#efa54f" fill-opacity="0.35" stroke="#efa54f" stroke-width="1.6"/>
    <rect x="488.8" y="498" width="20" height="82" fill="#efa54f" fill-opacity="0.35" stroke="#efa54f" stroke-width="1.6"/>

    <!-- display aperture 174 x 310 -->
    <rect x="303" y="185" width="174" height="310" rx="3" fill="#efa54f" fill-opacity="0.30" stroke="#efa54f" stroke-width="2.5"/>
    <text x="390" y="330" font-size="16" font-weight="700" fill="#efa54f" text-anchor="middle">DISPLAY</text>
    <text x="390" y="352" font-size="14" fill="#efa54f" text-anchor="middle">174 × 310</text>

    <!-- rockered feet -->
    <rect x="150" y="1070" width="116" height="80" fill="#d8a0c0" fill-opacity="0.30" stroke="#d8a0c0" stroke-width="2"/>
    <rect x="514" y="1070" width="116" height="80" fill="#d8a0c0" fill-opacity="0.30" stroke="#d8a0c0" stroke-width="2"/>

    <!-- hip axis -->
    <line x1="120" y1="539.2" x2="700" y2="539.2" stroke="#e36b56" stroke-width="2" stroke-dasharray="16 6 4 6"/>
    <circle cx="278" cy="539.2" r="7" fill="none" stroke="#e36b56" stroke-width="2.5"/>
    <circle cx="502" cy="539.2" r="7" fill="none" stroke="#e36b56" stroke-width="2.5"/>
    <text x="708" y="544" font-size="14" font-weight="700" fill="#e36b56">HIP AXIS  Y 610.8</text>

    <!-- ground -->
    <line x1="110" y1="1150" x2="700" y2="1150" stroke="#9aa7b0" stroke-width="2.5"/>
  </g>

  <!-- front dimensions -->
  <g stroke="#9cabb4" font-size="14" fill="#9cabb4">
    <!-- overall height -->
    <line x1="92" y1="150" x2="92" y2="1150" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="74" y="650" font-weight="700" font-size="18" fill="#9aa7b0" text-anchor="middle" transform="rotate(-90 74 650)">1000</text>
    <!-- hip height -->
    <line x1="672" y1="539.2" x2="672" y2="1150" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="690" y="850" font-weight="700" text-anchor="middle" transform="rotate(-90 690 850)">610.8</text>
    <!-- foot -->
    <line x1="132" y1="1070" x2="132" y2="1150" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="118" y="1115" text-anchor="middle" transform="rotate(-90 118 1115)">80</text>
    <!-- display height + position -->
    <line x1="288" y1="185" x2="288" y2="495" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="274" y="340" text-anchor="middle" transform="rotate(-90 274 340)">310</text>
    <line x1="640" y1="185" x2="640" y2="150" stroke-width="1.2" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="652" y="176">35 to crown</text>

    <!-- overall width -->
    <line x1="150" y1="1230" x2="630" y2="1230" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <line x1="150" y1="1160" x2="150" y2="1240" stroke-width="1"/>
    <line x1="630" y1="1160" x2="630" y2="1240" stroke-width="1"/>
    <text x="390" y="1262" font-weight="700" font-size="18" fill="#9aa7b0" text-anchor="middle">480 OVERALL</text>

    <!-- chassis and arms -->
    <line x1="270" y1="1195" x2="510" y2="1195" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <line x1="270" y1="1160" x2="270" y2="1205" stroke-width="1"/>
    <line x1="510" y1="1160" x2="510" y2="1205" stroke-width="1"/>
    <text x="390" y="1189" font-weight="700" text-anchor="middle">240 CHASSIS</text>
    <line x1="150" y1="1195" x2="266" y2="1195" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="208" y="1189" text-anchor="middle">116</text>
    <text x="208" y="1055" font-size="12" fill="#d8a0c0" text-anchor="middle">SOLE FLAT ACROSS WIDTH</text>
    <line x1="514" y1="1195" x2="630" y2="1195" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="572" y="1189" text-anchor="middle">116</text>
    <text x="268" y="1290" font-size="13" text-anchor="middle">4 clr</text>
    <line x1="266" y1="1276" x2="270" y2="1276" stroke-width="1.2"/>
    <text x="512" y="1290" font-size="13" text-anchor="middle">4 clr</text>
    <line x1="510" y1="1276" x2="514" y2="1276" stroke-width="1.2"/>
    <!-- display width -->
    <line x1="303" y1="520" x2="477" y2="520" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="390" y="540" text-anchor="middle">174</text>
  </g>

  <!-- ============================ SIDE ============================ -->
  <g>
    <rect x="780" y="150" width="260" height="1000" fill="#8b98a2" fill-opacity="0.08" stroke="#9aa7b0" stroke-width="3"/>
    <!-- display stack at the front face -->
    <rect x="1007" y="185" width="32" height="310" fill="#efa54f" fill-opacity="0.30" stroke="#efa54f" stroke-width="2"/>
    <text x="1052" y="330" font-size="13" fill="#efa54f">28 unit</text>
    <text x="1052" y="350" font-size="13" fill="#efa54f">+4 lens</text>
    <!-- equipment depth -->
    <rect x="795" y="695" width="210" height="225" fill="#6fb8dd" fill-opacity="0.20" stroke="#6fb8dd" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="900" y="815" font-size="13" font-weight="700" fill="#6fb8dd" text-anchor="middle">PC 210 DEEP</text>
    <rect x="805" y="945" width="210" height="150" fill="#58bd8c" fill-opacity="0.24" stroke="#58bd8c" stroke-width="1.6"/>
    <text x="910" y="1028" font-size="13" font-weight="700" fill="#58bd8c" text-anchor="middle">BATTERY 210</text>
    <!-- hip axis -->
    <line x1="750" y1="539.2" x2="1070" y2="539.2" stroke="#e36b56" stroke-width="2" stroke-dasharray="16 6 4 6"/>
    <circle cx="910" cy="539.2" r="7" fill="none" stroke="#e36b56" stroke-width="2.5"/>
    <!-- rockered sole, R200 -->
    <path d="M780,1070 L1040,1070 L1040,1128.3 Q910,1171.7 780,1128.3 Z" fill="#d8a0c0" fill-opacity="0.30" stroke="#d8a0c0" stroke-width="2"/>
    <text x="910" y="1200" font-size="13" font-weight="700" fill="#d8a0c0" text-anchor="middle">ROCKER R400 FORE-AFT ONLY · 21.7 SAGITTA · 12.7 CLEARANCE AT 20°</text>
    <line x1="750" y1="1150" x2="1090" y2="1150" stroke="#9aa7b0" stroke-width="2.5"/>
  </g>

  <g stroke="#9cabb4" font-size="14" fill="#9cabb4">
    <line x1="780" y1="1230" x2="1040" y2="1230" stroke-width="1.4" marker-start="url(#al)" marker-end="url(#ar)"/>
    <line x1="780" y1="1160" x2="780" y2="1240" stroke-width="1"/>
    <line x1="1040" y1="1160" x2="1040" y2="1240" stroke-width="1"/>
    <text x="910" y="1262" font-weight="700" font-size="18" fill="#9aa7b0" text-anchor="middle">259.9 DEPTH</text>
  </g>

  <!-- section note -->
  <g font-size="14" fill="#9cabb4">
    <line x1="60" y1="1305" x2="1180" y2="1305" stroke="#9aa7b0" stroke-width="1.2"/>
    <text x="60" y="1325">Subframe 6061-T6: 20 × 40 rails at 2.5 wall, 20 × 20 cross and depth members at 2.0 wall · shell 1.2 formed 5052-H32 · form and packaging only, not releasable</text>
  </g>
</svg>

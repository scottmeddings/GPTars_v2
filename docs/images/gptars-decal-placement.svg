<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1240" width="1180" height="1240" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <title>GP-TARS V2 decal placement, front and rear elevations</title>
  <desc>Front and rear elevations showing where each decal from the A2 sheet is applied: the TARS wordmark and hazard markings on the front, and the data plate, E-stop surround and service labels on the rear service panels. Dimensions in millimetres.</desc>

  <defs>
    <pattern id="hz" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="14" fill="#f2c200"/>
      <rect x="7" width="7" height="14" fill="#1a1a1a"/>
    </pattern>
  </defs>

  <g fill="#9cabb4">
    <text x="60" y="40" font-size="24" font-weight="800" fill="#9aa7b0">GP-TARS V2 · DECAL PLACEMENT</text>
    <text x="60" y="62" font-size="14">Artwork from gptars-decal-sheet.svg · positions in millimetres above ground</text>
  </g>
  <line x1="60" y1="78" x2="1120" y2="78" stroke="#9aa7b0" stroke-width="1.4"/>

  <text x="330" y="104" font-size="16" font-weight="700" fill="#9aa7b0" text-anchor="middle">FRONT</text>
  <text x="900" y="104" font-size="16" font-weight="700" fill="#9aa7b0" text-anchor="middle">REAR</text>

  <!-- ===================== FRONT ELEVATION ===================== -->
  <g>
    <rect x="90" y="120" width="116" height="920" fill="#6c7a85" fill-opacity="0.16" stroke="#9aa7b0" stroke-width="2"/>
    <rect x="454" y="120" width="116" height="920" fill="#6c7a85" fill-opacity="0.16" stroke="#9aa7b0" stroke-width="2"/>
    <rect x="90" y="1040" width="116" height="80" fill="#d8a0c0" fill-opacity="0.22" stroke="#d8a0c0" stroke-width="1.6"/>
    <rect x="454" y="1040" width="116" height="80" fill="#d8a0c0" fill-opacity="0.22" stroke="#d8a0c0" stroke-width="1.6"/>
    <rect x="210" y="120" width="240" height="975" fill="#8b98a2" fill-opacity="0.10" stroke="#9aa7b0" stroke-width="2.5"/>

    <!-- display aperture -->
    <rect x="243" y="155" width="174" height="310" rx="3" fill="#1a1a1a" fill-opacity="0.55" stroke="#efa54f" stroke-width="2"/>
    <text x="330" y="315" font-size="13" font-weight="700" fill="#efa54f" text-anchor="middle">DISPLAY</text>

    <!-- hip break -->
    <line x1="210" y1="509" x2="450" y2="509" stroke="#e36b56" stroke-width="1.2" stroke-dasharray="10 5"/>

    <!-- pinch stripes across the hip gap and down the limb leading edges -->
    <rect x="210" y="503" width="240" height="14" fill="url(#hz)"/>
    <rect x="92" y="503" width="14" height="537" fill="url(#hz)"/>
    <rect x="554" y="503" width="14" height="537" fill="url(#hz)"/>

    <!-- TARS wordmark, rotated, sitting under the display -->
    <g>
      <text x="300" y="705" font-size="46" font-weight="700" fill="#d97b19" text-anchor="middle"
            letter-spacing="8" transform="rotate(-90 300 705)">TARS</text>
      <circle cx="372" cy="600" r="2.6" fill="#d97b19"/><circle cx="390" cy="600" r="2.6" fill="#d97b19"/><circle cx="381" cy="609" r="2.6" fill="#d97b19"/><circle cx="372" cy="618" r="2.6" fill="#d97b19"/><circle cx="390" cy="618" r="2.6" fill="#d97b19"/><circle cx="381" cy="627" r="2.6" fill="#d97b19"/><circle cx="372" cy="636" r="2.6" fill="#d97b19"/><circle cx="390" cy="636" r="2.6" fill="#d97b19"/><circle cx="381" cy="645" r="2.6" fill="#d97b19"/><circle cx="372" cy="654" r="2.6" fill="#d97b19"/><circle cx="390" cy="654" r="2.6" fill="#d97b19"/>
      <text x="240" y="560" font-size="11" fill="#d97b19">wordmark 52 × 250 at Y 350</text>
    </g>

    <!-- starts without warning, front and prominent -->
    <g transform="translate(370,880)">
      <path d="M22,0 L44,40 L0,40 Z" fill="#f2c200" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>
      <rect x="14" y="20" width="7" height="13" fill="#1a1a1a"/>
      <rect x="23" y="20" width="7" height="13" fill="#1a1a1a"/>
      <path d="M12,17 h20" stroke="#1a1a1a" stroke-width="2"/>
    </g>

    <!-- crush hazard beside the hip -->
    <g transform="translate(238,455)">
      <path d="M22,0 L44,40 L0,40 Z" fill="#f2c200" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>
      <rect x="16" y="14" width="12" height="3.4" fill="#1a1a1a"/>
      <rect x="16" y="24" width="12" height="3.4" fill="#1a1a1a"/>
    </g>

    <!-- panel index marks -->
    <g fill="#1a1a1a" font-size="9" font-weight="700">
      <rect x="420" y="960" width="22" height="22" fill="#9aa7b0" fill-opacity="0.6"/>
      <text x="431" y="975" text-anchor="middle">P1</text>
      <rect x="120" y="960" width="22" height="22" fill="#9aa7b0" fill-opacity="0.6"/>
      <text x="131" y="975" text-anchor="middle">P2</text>
    </g>

    <line x1="70" y1="1120" x2="600" y2="1120" stroke="#9aa7b0" stroke-width="2"/>
  </g>

  <!-- ===================== REAR ELEVATION ===================== -->
  <g>
    <rect x="660" y="120" width="116" height="920" fill="#6c7a85" fill-opacity="0.16" stroke="#9aa7b0" stroke-width="2"/>
    <rect x="1024" y="120" width="116" height="920" fill="#6c7a85" fill-opacity="0.16" stroke="#9aa7b0" stroke-width="2"/>
    <rect x="660" y="1040" width="116" height="80" fill="#d8a0c0" fill-opacity="0.22" stroke="#d8a0c0" stroke-width="1.6"/>
    <rect x="1024" y="1040" width="116" height="80" fill="#d8a0c0" fill-opacity="0.22" stroke="#d8a0c0" stroke-width="1.6"/>
    <rect x="780" y="120" width="240" height="975" fill="#8b98a2" fill-opacity="0.10" stroke="#9aa7b0" stroke-width="2.5"/>

    <!-- rear service panel divisions -->
    <g stroke="#9aa7b0" stroke-width="1" stroke-dasharray="6 4">
      <line x1="780" y1="960" x2="1020" y2="960"/>
      <line x1="780" y1="710" x2="1020" y2="710"/>
      <line x1="780" y1="512" x2="1020" y2="512"/>
    </g>

    <!-- E-stop surround, centre cut for the mushroom head -->
    <g>
      <circle cx="900" cy="385" r="35" fill="#c8102e"/>
      <circle cx="900" cy="385" r="22" fill="#f2c200"/>
      <circle cx="900" cy="385" r="15" fill="#1a1a1a" fill-opacity="0.85" stroke="#9aa7b0" stroke-width="0.8" stroke-dasharray="3 2"/>
      <text x="900" y="337" font-size="9" font-weight="700" fill="#c8102e" text-anchor="middle">EMERGENCY STOP  Ø70</text>
    </g>

    <!-- isolate warning above the access panels -->
    <g>
      <rect x="835" y="470" width="130" height="16" fill="#c8102e"/>
      <text x="843" y="482" font-size="8.5" font-weight="700" fill="#ffffff">ISOLATE BEFORE OPENING</text>
    </g>

    <!-- service labels on their panels -->
    <g font-size="8.5" font-weight="700" fill="#ffffff">
      <rect x="835" y="530" width="130" height="16" fill="#1a1a1a"/>
      <text x="843" y="542">GPU ACCESS</text>
      <rect x="835" y="730" width="130" height="16" fill="#1a1a1a"/>
      <text x="843" y="742">COMPUTE ACCESS</text>
      <rect x="835" y="980" width="130" height="16" fill="#1a1a1a"/>
      <text x="843" y="992">BATTERY ACCESS</text>
    </g>

    <!-- data plate -->
    <g>
      <rect x="840" y="838" width="120" height="72" fill="#1a1a1a"/>
      <text x="848" y="852" font-size="8" font-weight="700" fill="#ffffff">GP-TARS V2 1000</text>
      <line x1="848" y1="856" x2="952" y2="856" stroke="#c8a11a" stroke-width="0.7"/>
      <g font-size="6.4" fill="#cfd6da">
        <text x="848" y="868">HEIGHT</text><text x="906" y="868" fill="#ffffff">1000 mm</text>
        <text x="848" y="878">BUS</text><text x="906" y="878" fill="#ffffff">12.8 V DC</text>
        <text x="848" y="888">STRUCTURE</text><text x="906" y="888" fill="#ffffff">6061 / 5052</text>
        <text x="848" y="898">UNIT</text><text x="906" y="898" fill="#ffffff">001</text>
      </g>
    </g>

    <!-- hazard triangles at their hazards -->
    <g transform="translate(790,955)">
      <path d="M22,0 L44,40 L0,40 Z" fill="#f2c200" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M25,13 l-8,13 h6 l-3,10 9,-14 h-6 z" fill="#1a1a1a"/>
    </g>
    <g transform="translate(790,555)">
      <path d="M22,0 L44,40 L0,40 Z" fill="#f2c200" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="22" cy="29" r="5" fill="#1a1a1a"/>
      <path d="M17,20 q3,-4 0,-7 M22,20 q3,-4 0,-7 M27,20 q3,-4 0,-7" stroke="#1a1a1a" stroke-width="1.4" fill="none"/>
    </g>

    <rect x="780" y="503" width="240" height="14" fill="url(#hz)"/>

    <line x1="640" y1="1120" x2="1160" y2="1120" stroke="#9aa7b0" stroke-width="2"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#9cabb4">
    <line x1="60" y1="1160" x2="1120" y2="1160" stroke="#9aa7b0" stroke-width="1.2"/>
    <text x="60" y="1182" font-weight="700" fill="#9aa7b0">FRONT</text>
    <text x="140" y="1182">TARS wordmark, rotated, 52 × 250 at Y 350 with dot matrix · starts-without-warning and crush triangles · pinch stripes on the hip gap and limb leading edges · panel index marks</text>
    <text x="60" y="1202" font-weight="700" fill="#9aa7b0">REAR</text>
    <text x="140" y="1202">E-stop surround Ø70 at Y 700 · isolate warning · GPU, compute and battery access labels on their own panels · data plate · 24 V live and hot surface triangles</text>
    <text x="60" y="1226" font-size="11" fill="#8b98a2">Hazard pictograms follow ISO 7010 geometry but are original artwork and carry no certification. Stripes and the E-stop surround are safety equipment, not styling, and belong on the robot before any powered test.</text>
  </g>
</svg>

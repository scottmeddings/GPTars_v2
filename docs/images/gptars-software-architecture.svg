<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">GP-TARS V2 software architecture</title><desc id="desc">Phase 1 local-first architecture showing sensors, Docker services on Ubuntu, ROS 2 and the independent safety MCU, with future RTX expansion.</desc><defs><style><![CDATA[.bg{fill:#0e1519}.panel{fill:#121d22;stroke:#33444d;stroke-width:2}.blue{fill:#13283a;stroke:#4e8fc5}.green{fill:#173126;stroke:#55a56f}.purple{fill:#2a2038;stroke:#9a72c4}.amber{fill:#342b16;stroke:#d7a43d}.red{fill:#351d1d;stroke:#c95c5c}.box{stroke-width:2;rx:14}.t{font-family:Arial,Helvetica,sans-serif;fill:#e8f0f4}.muted{fill:#aab9c1}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.p{font-size:15px}.small{font-size:13px}.arrow{stroke:#79a9c8;stroke-width:3;fill:none;marker-end:url(#m)}.ctrl{stroke:#b68bd6;stroke-width:3;fill:none;marker-end:url(#m2)}.safe{stroke:#df6868;stroke-width:3;fill:none;marker-end:url(#m3)}.dash{stroke-dasharray:9 7}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}.chip{fill:#20343e;stroke:#4d6672;rx:8}]]></style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#79a9c8"/></marker><marker id="m2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b68bd6"/></marker><marker id="m3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#df6868"/></marker></defs><rect class="bg" width="1600" height="980"/><text x="800" y="52" text-anchor="middle" class="t h1">GP-TARS V2 SOFTWARE ARCHITECTURE — PHASE 1</text><text x="800" y="82" text-anchor="middle" class="t p muted">Ubuntu Server 24.04 · local-first AI · OAK-D onboard vision · Docker microservices · ROS 2 · independent safety MCU</text><rect x="30" y="120" width="300" height="390" class="panel" rx="16"/><text x="55" y="154" class="t label">UPPER INTERACTION MODULE</text><rect x="55" y="180" width="250" height="92" class="blue box"/><text x="75" y="210" class="t h3">OAK-D Pro W USB</text><text x="75" y="234" class="t p">Wide RGB + stereo depth</text><text x="75" y="256" class="t small muted">Onboard AI · tracking · spatial data</text><rect x="55" y="292" width="250" height="82" class="blue box"/><text x="75" y="322" class="t h3">Top Display</text><text x="75" y="346" class="t p">Face · state · warnings · UI</text><rect x="55" y="394" width="250" height="92" class="blue box"/><text x="75" y="424" class="t h3">ReSpeaker XVF3800</text><text x="75" y="448" class="t p">4-mic array · beamforming</text><text x="75" y="470" class="t small muted">AEC · VAD · direction of arrival</text><rect x="30" y="540" width="300" height="330" class="panel" rx="16"/><text x="55" y="574" class="t label">ROBOT HARDWARE</text><rect x="55" y="600" width="250" height="66" class="purple box"/><text x="75" y="628" class="t h3">Body IMU / sensors</text><text x="75" y="650" class="t small muted">orientation · contact · thermal</text><rect x="55" y="686" width="250" height="66" class="purple box"/><text x="75" y="714" class="t h3">Safety / Motion MCU</text><text x="75" y="736" class="t small muted">watchdog · limits · contactor</text><rect x="55" y="772" width="250" height="66" class="red box"/><text x="75" y="800" class="t h3">CAN actuators</text><text x="75" y="822" class="t small muted">AK-series closed-loop joints</text><rect x="375" y="120" width="830" height="750" class="panel" rx="18"/><text x="400" y="154" class="t label">MINISFORUM AI X1 PRO-370 · UBUNTU SERVER 24.04 · DOCKER</text><rect x="400" y="182" width="245" height="118" class="blue box"/><text x="420" y="212" class="t h3">tars-vision</text><text x="420" y="238" class="t p">DepthAI ingestion</text><text x="420" y="260" class="t p">people / objects / distance</text><text x="420" y="282" class="t small muted">structured observations</text><rect x="670" y="182" width="245" height="118" class="blue box"/><text x="690" y="212" class="t h3">tars-stt</text><text x="690" y="238" class="t p">wake word · VAD · STT</text><text x="690" y="260" class="t p">speaker direction</text><text x="690" y="282" class="t small muted">local speech pipeline</text><rect x="940" y="182" width="245" height="118" class="blue box"/><text x="960" y="212" class="t h3">tars-tts / display</text><text x="960" y="238" class="t p">local speech output</text><text x="960" y="260" class="t p">face / animation state</text><text x="960" y="282" class="t small muted">barge-in aware</text><rect x="400" y="326" width="245" height="132" class="green box"/><text x="420" y="356" class="t h3">tars-core</text><text x="420" y="382" class="t p">orchestrator + state machine</text><text x="420" y="404" class="t p">personality + user context</text><text x="420" y="426" class="t p">behaviour supervisor</text><text x="420" y="448" class="t small muted">AI decides WHAT</text><rect x="670" y="326" width="245" height="132" class="green box"/><text x="690" y="356" class="t h3">tars-llm</text><text x="690" y="382" class="t p">local model server</text><text x="690" y="404" class="t p">reasoning · conversation</text><text x="690" y="426" class="t p">tool / skill selection</text><text x="690" y="448" class="t small muted">HX370 initially · CUDA later</text><rect x="940" y="326" width="245" height="132" class="green box"/><text x="960" y="356" class="t h3">tars-memory</text><text x="960" y="382" class="t p">PostgreSQL + pgvector</text><text x="960" y="404" class="t p">personal · semantic · episodic</text><text x="960" y="426" class="t p">learning + robot memory</text><text x="960" y="448" class="t small muted">identity-aware retrieval</text><rect x="400" y="484" width="245" height="118" class="amber box"/><text x="420" y="514" class="t h3">NATS event bus</text><text x="420" y="540" class="t p">speech · vision · health</text><text x="420" y="562" class="t p">wake / sleep / profiles</text><text x="420" y="584" class="t small muted">application messaging</text><rect x="670" y="484" width="245" height="118" class="amber box"/><text x="690" y="514" class="t h3">tars-api / web</text><text x="690" y="540" class="t p">REST + WebSocket</text><text x="690" y="562" class="t p">settings · diagnostics</text><text x="690" y="584" class="t small muted">local management</text><rect x="940" y="484" width="245" height="118" class="amber box"/><text x="960" y="514" class="t h3">telemetry</text><text x="960" y="540" class="t p">logs · temperatures · battery</text><text x="960" y="562" class="t p">service health</text><text x="960" y="584" class="t small muted">persistent diagnostics</text><rect x="400" y="632" width="245" height="118" class="purple box"/><text x="420" y="662" class="t h3">tars-ros</text><text x="420" y="688" class="t p">ROS 2 Jazzy</text><text x="420" y="710" class="t p">state · TF · actions</text><text x="420" y="732" class="t small muted">robot framework</text><rect x="670" y="632" width="245" height="118" class="purple box"/><text x="690" y="662" class="t h3">tars-motion</text><text x="690" y="688" class="t p">gait · IK · poses</text><text x="690" y="710" class="t p">approved trajectories</text><text x="690" y="732" class="t small muted">robot decides HOW</text><rect x="940" y="632" width="245" height="118" class="purple box"/><text x="960" y="662" class="t h3">tars-can</text><text x="960" y="688" class="t p">host ↔ safety MCU bridge</text><text x="960" y="710" class="t p">heartbeat + command framing</text><text x="960" y="732" class="t small muted">no raw LLM motor access</text><rect x="400" y="780" width="785" height="62" class="red box"/><text x="792" y="807" text-anchor="middle" class="t h3">HARD SAFETY BOUNDARY</text><text x="792" y="830" text-anchor="middle" class="t p">E-stop · motor contactor · watchdog · joint/current/temperature limits remain independent of Docker and the LLM</text><rect x="1245" y="120" width="325" height="330" class="panel" rx="16"/><text x="1270" y="154" class="t label">DEPLOYMENT &amp; STORAGE</text><rect x="1270" y="180" width="275" height="76" class="amber box"/><text x="1290" y="210" class="t h3">GitHub → Actions → GHCR</text><text x="1290" y="234" class="t small muted">versioned images + rollback</text><rect x="1270" y="276" width="275" height="76" class="amber box"/><text x="1290" y="306" class="t h3">Watchtower / Compose</text><text x="1290" y="330" class="t small muted">approved image updates</text><rect x="1270" y="372" width="275" height="54" class="amber box"/><text x="1290" y="404" class="t h3">4 TB NVMe persistent data</text><rect x="1245" y="480" width="325" height="250" class="panel" rx="16"/><text x="1270" y="514" class="t label">PHASE 2+ EXPANSION</text><rect x="1270" y="540" width="275" height="80" class="green box"/><text x="1290" y="570" class="t h3">RTX 2000 Ada 16 GB</text><text x="1290" y="594" class="t small muted">CUDA LLM + heavier vision</text><rect x="1270" y="640" width="275" height="66" class="green box"/><text x="1290" y="670" class="t h3">Optional cloud tools</text><text x="1290" y="692" class="t small muted">never required for core operation</text><path d="M305 226 H400" class="arrow"/><text x="337" y="214" class="t small">USB 3</text><path d="M305 438 H670" class="arrow"/><text x="445" y="426" class="t small">USB audio</text><path d="M305 632 H400" class="ctrl"/><path d="M305 718 H940" class="ctrl"/><path d="M305 805 H940" class="safe"/><path d="M645 392 H670" class="arrow"/><path d="M915 392 H940" class="arrow"/><path d="M792 458 V484" class="arrow"/><path d="M522 602 V632" class="ctrl"/><path d="M792 602 V632" class="ctrl"/><path d="M1062 602 V632" class="ctrl"/><path d="M1062 750 V780" class="safe"/><path d="M1205 242 H1270" class="arrow dash"/><path d="M1205 580 H1270" class="arrow dash"/><rect x="375" y="900" width="1195" height="48" class="chip"/><text x="400" y="930" class="t p"><tspan font-weight="700">FLOW:</tspan> sensors produce structured observations → TARS reasons and selects approved skills → ROS 2 plans motion → safety MCU validates and executes → CAN actuators move.</text></svg>